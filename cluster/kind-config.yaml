# kind cluster for the build platform.
#   kind create cluster --name k8s-platform --config cluster/kind-config.yaml
# The port mapping exposes the dashboard NodePort (30080) on http://localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
