apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: builds
  labels:
    app.kubernetes.io/part-of: k8s-platform
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      serviceAccountName: build-agent
      containers:
        - name: dashboard
          image: k8s-platform/agent:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/dashboard/server.py"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-config
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace
---
# NodePort 30080 is mapped to http://localhost:8080 by cluster/kind-config.yaml.
# On Minikube use: minikube service dashboard -n builds
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: builds
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
